<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Palet dan kuas lukis">
  <defs>
    <linearGradient id="tacBg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="64" y2="64">
      <stop offset="0" stop-color="#0EA5E9"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#tacBg)"/>

  <!-- Palet -->
  <circle cx="27" cy="36" r="17" fill="#FFFFFF"/>
  <!-- Lubang ibu jari: diisi gradien latar (userSpaceOnUse) agar menyatu -->
  <circle cx="33" cy="45" r="5" fill="url(#tacBg)"/>
  <circle cx="19" cy="28" r="3.6" fill="#EF4444"/>
  <circle cx="29" cy="26" r="3.6" fill="#F59E0B"/>
  <circle cx="38" cy="35" r="3.6" fill="#10B981"/>
  <circle cx="18" cy="40" r="3.6" fill="#6366F1"/>

  <!-- Kuas, menyerong ke palet -->
  <g transform="translate(44 20) rotate(45)">
    <rect x="-3" y="-17" width="6" height="15" rx="3" fill="#FBBF24"/>
    <rect x="-4.2" y="-3" width="8.4" height="5" rx="1.6" fill="#E2E8F0"/>
    <path d="M-4.2 2h8.4l-4.2 10z" fill="#FB923C"/>
  </g>
</svg>
