; Penyetelan PHP untuk container production di Render.
; Dimuat paling akhir (awalan zz-) sehingga menimpa bawaan image.

memory_limit = 256M
max_execution_time = 60

; Unggahan foto karya murid. Nginx dibatasi 20m juga (lihat nginx.conf.template).
upload_max_filesize = 20M
post_max_size = 21M

expose_php = Off
display_errors = Off
log_errors = On
error_log = /dev/stderr

; Kode tidak pernah berubah di dalam image, jadi timestamp tak perlu dicek.
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
